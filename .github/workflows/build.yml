name: Build Windows portable app
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        shell: powershell
        run: .\build.ps1 -Package -Platform ${{ matrix.platform }}
      - name: Run offline checks
        shell: powershell
        run: .\tests\run-tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: YandexDiskRescue-win-${{ matrix.platform }}
          path: dist/YandexDiskRescue-win-${{ matrix.platform }}.zip
